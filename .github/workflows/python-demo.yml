name: Python demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install demo and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements.txt
      - name: Run synthetic and real-runtime tests
        run: python -m unittest discover -s tests -v
